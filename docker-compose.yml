version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rate-limiter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rate_limiter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rate-limiter-api
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file:
      - apps/api/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/rate-limiter-postgres
      - REDIS_URL=redis://redis:6379
      - PORT=3001

volumes:
  postgres_data:
